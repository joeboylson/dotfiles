# Slag — generated from palette.mjs, do not edit by hand.
#
# Import from your alacritty.toml:
#   general.import = ["~/.config/alacritty/slag.toml"]

[colors.primary]
background = "#282828"
foreground = "#e4e4e4"
dim_foreground = "#9a9a9a"
bright_foreground = "#e4e4e4"

[colors.cursor]
text = "#282828"
cursor = "#fabd2f"

[colors.vi_mode_cursor]
text = "#282828"
cursor = "#83a598"

[colors.selection]
text = "CellForeground"
background = "#67552a"

[colors.search.matches]
foreground = "#282828"
background = "#fabd2f"

[colors.search.focused_match]
foreground = "#282828"
background = "#fabd2f"

[colors.footer_bar]
foreground = "#e4e4e4"
background = "#3b3b3b"

[colors.hints.start]
foreground = "#282828"
background = "#fabd2f"

[colors.hints.end]
foreground = "#e4e4e4"
background = "#424242"

