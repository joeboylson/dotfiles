<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Geist as the default sans and monospace. Prepended, so anything Geist
     doesn't cover (emoji, CJK, icon glyphs) still falls through to the
     next font in the list. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Geist</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Geist Mono</family></prefer>
  </alias>
</fontconfig>
