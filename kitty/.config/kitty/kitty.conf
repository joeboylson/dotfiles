font_family      JetBrainsMono Nerd Font
font_size        14

# Each pane gets its own full border with a gap around it: |  |  |  |
enabled_layouts       splits,stack
draw_minimal_borders  no
window_border_width   1pt
window_border_radius  6pt
window_margin_width   6
window_padding_width  8
single_window_margin_width 0

# Ghostty-style split and tab keys
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+t       new_tab_with_cwd
map cmd+w       close_window
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
map cmd+shift+enter toggle_layout stack

# Tab bar — mirrors the tmux status bar: centered at the bottom, two-tone
# pills (number chip + name body). Gray when inactive, blue when current.
tab_bar_edge          bottom
tab_bar_align         center
tab_bar_style         separator
tab_separator         " "
tab_bar_min_tabs      1
tab_bar_margin_height 6 6
tab_title_max_length  30
tab_title_template        "{fmt.fg.color7}{fmt.bg.default}{fmt.fg.color0}{fmt.bg.color7}{fmt.bold} {index} {fmt.fg.color15}{fmt.bg.color238}{fmt.nobold} {bell_symbol}{activity_symbol}{title} {fmt.fg.color238}{fmt.bg.default}"
active_tab_title_template "{fmt.fg.color4}{fmt.bg.default}{fmt.fg.color15}{fmt.bg.color4}{fmt.bold} {index} {fmt.fg.color0}{fmt.bg.color12}{fmt.nobold} {bell_symbol}{activity_symbol}{title} {fmt.fg.color12}{fmt.bg.default}"
active_tab_font_style   normal
inactive_tab_font_style normal

# Clear vars inherited when kitty is launched from a Ghostty shell: a stale
# MACHINE_PICKED=1 makes the machine picker (~/.zshrc) think it already ran.
env MACHINE_PICKED=
env TERM_PROGRAM=kitty
