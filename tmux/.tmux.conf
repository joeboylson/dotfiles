# --- Behavior ---
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

# True color + italics passthrough
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# Sensible window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status bar ---
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Dark track so the pills sit on a bar instead of floating on the terminal bg.
set -g status-style "bg=colour234,fg=colour245"

# Two-row status: row 0 holds the real bar, row 1 is blank so the track reads as
# a padded band rather than a single tight line. Set `status 1` to reclaim the row.
set -g status 2
set -g "status-format[1]" ""

# Left: session name in a pill
set -g status-left-length 40
set -g status-left "  #[fg=colour220,bg=colour234]#[fg=colour232,bg=colour220,bold] #S #[fg=colour220,bg=colour234,nobold]     "

# Right: host + time
set -g status-right-length 60
set -g status-right "#[fg=colour245]#h #[fg=colour240]│ #[fg=colour245]%a %b %d  #[fg=colour220,bg=colour234]#[fg=colour232,bg=colour220,bold] %H:%M #[fg=colour220,bg=colour234,nobold]  "

# Window list — each tab is a rounded pill
setw -g window-status-format "#[fg=colour245,bg=colour234]#[fg=colour232,bg=colour245,bold] #I #[fg=colour250,bg=colour239,nobold] #W #[fg=colour239,bg=colour234]"
setw -g window-status-current-format "#[fg=colour94,bg=colour234]#[fg=colour231,bg=colour94,bold] #I #[fg=colour232,bg=colour220] #W #[fg=colour220,bg=colour234,nobold]"
setw -g window-status-separator " "

# Panes
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour220"

# Messages / command prompt
set -g message-style "fg=colour220,bg=default"

# --- Plugins (TPM) ---
# Save/restore sessions across close/reopen and reboots.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save every 1 min + auto-restore on start

# Continuum: restore the last session automatically when tmux starts.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# Resurrect: also bring back running programs (extend as you like).
set -g @resurrect-capture-pane-contents 'on'

# Keep this line last — it initializes TPM.
run '~/.tmux/plugins/tpm/tpm'
