# Slag theme — drawn with ANSI palette slots, not hex, so tmux chrome inherits
# whatever colors the terminal (Alacritty, Ghostty, iTerm…) has assigned.
# colour0-7 are the normal slots, colour8-15 the bright ones. Accent is blue.

# --- Behavior ---
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

# True color + italics passthrough
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# Sensible window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status bar ---
set -g status-interval 5
set -g status-position bottom
set -g status-justify absolute-centre

# No track — `default` is the terminal's own background, so the bar inherits it
# and stays transparent if the terminal is. The pills carry their own fill, so
# they still read as pills without a band behind them.
set -g status-style "bg=default,fg=colour7"

# Two-row status: row 0 holds the real bar, row 1 is blank so the track reads as
# a padded band rather than a single tight line. Set `status 1` to reclaim the row.
set -g status 2
set -g "status-format[1]" ""

# Left: session name in a pill
set -g status-left-length 40
set -g status-left "  #[fg=colour12,bg=default]#[fg=colour0,bg=colour12,bold] #S #[fg=colour12,bg=default,nobold]     "

# Right: host + time
set -g status-right-length 60
set -g status-right "#[fg=colour7]#h #[fg=colour244]│ #[fg=colour7]%a %b %d  #[fg=colour12,bg=default]#[fg=colour0,bg=colour12,bold] %H:%M #[fg=colour12,bg=default,nobold]  "

# Window list — inactive tabs are gray, the current tab is blue. Same two-tone
# pill either way: a solid chip for the number, a lighter body for the name.
#
# The inactive body is colour238 (#444444) from the xterm-256 grayscale ramp,
# not the themeable 16. The 16-color palette's only mid-gray is #9a9a9a, far
# too light for a body fill, and the one slot that could hold a subtle gray
# (colour8) is what most CLI tools dim their text with. Only these neutrals are
# pinned; every hue here still comes from the terminal's own palette.
setw -g window-status-format "#[fg=colour7,bg=default]#[fg=colour0,bg=colour7,bold] #I #[fg=colour15,bg=colour238,nobold] #W #[fg=colour238,bg=default]"
setw -g window-status-current-format "#[fg=colour4,bg=default]#[fg=colour15,bg=colour4,bold] #I #[fg=colour0,bg=colour12,nobold] #W #[fg=colour12,bg=default]"
setw -g window-status-separator " "

# Panes
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour12"

# Messages / command prompt
set -g message-style "fg=colour12,bg=default"

# --- Plugins (TPM) ---
# Save/restore sessions across close/reopen and reboots.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save every 1 min + auto-restore on start

# Continuum: restore the last session automatically when tmux starts.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# Resurrect: also bring back running programs (extend as you like).
set -g @resurrect-capture-pane-contents 'on'

# Keep this line last — it initializes TPM.
run '~/.tmux/plugins/tpm/tpm'
